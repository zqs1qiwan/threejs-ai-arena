<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1410" />
    <meta name="description" content="四季 · SHIKI BONSAI — 一座随四时更迭的盆景世界，实时渲染。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23384a34'/%3E%3Cpath d='M16 24c0-6-3-9-3-12 0-2 2-3 3-3s3 1 3 3c0 3-3 6-3 12z' fill='%237fc25a'/%3E%3C/svg%3E" />
    <title>四季 · SHIKI BONSAI</title>
    <script type="module" crossorigin src="./assets/index-CrEFOdZL.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BT_gBupk.css">
  </head>
  <body>
    <div id="app"></div>

    <div id="ui">
      <header class="hud-top">
        <div class="brand">
          <h1>四季<span class="sep"></span><span class="en">SHIKI BONSAI</span></h1>
          <p>一座随四时更迭的盆景</p>
        </div>
        <div class="status">
          <div class="season-name" id="season-name">春 · Spring</div>
          <div class="season-sub"><span id="season-day">第 1 天</span><span class="dot">·</span><span id="stat-fps">0</span> fps</div>
        </div>
      </header>

      <footer class="hud-bottom">
        <nav class="season-track" id="season-track" aria-label="季节">
          <span class="pip active" data-i="0"><b>春</b><i>Spring</i></span>
          <span class="pip" data-i="1"><b>夏</b><i>Summer</i></span>
          <span class="pip" data-i="2"><b>秋</b><i>Autumn</i></span>
          <span class="pip" data-i="3"><b>冬</b><i>Winter</i></span>
          <span class="track-marker" id="track-marker" aria-hidden="true"></span>
        </nav>

        <div class="controls">
          <div class="speed">
            <label for="speed-range">季节流转</label>
            <input id="speed-range" type="range" min="0" max="100" value="45" />
            <span id="speed-val">约 60 秒 / 年</span>
          </div>
          <div class="btns">
            <button id="btn-pause" type="button" class="active">暂停</button>
            <button id="btn-orbit" type="button" class="active">环绕</button>
            <button id="btn-quality" type="button" class="active">画质</button>
            <button id="btn-view" type="button">近景</button>
            <button id="btn-reset" type="button">重置</button>
          </div>
        </div>

        <p class="hint desktop-only">拖拽环绕 · 滚轮或双指缩放 · 点击唤起季风 · 空格暂停 · 1–4 切换季节</p>
      </footer>
    </div>

    <div id="loader">
      <div class="loader-inner">
        <div class="loader-sprout"></div>
        <div class="loader-title">育て · GROWING THE BONSAI</div>
        <div class="loader-bar"><span id="loader-fill"></span></div>
        <div class="loader-sub" id="loader-sub">planting seed…</div>
      </div>
    </div>

    <div id="no-webgl" hidden>
      <div>
        <h2>需要 WebGL2</h2>
        <p>你的浏览器或设备暂不支持 WebGL2，无法运行此 3D 场景。请使用现代浏览器（Chrome / Edge / Safari）后重试。</p>
      </div>
    </div>

  </body></html>
